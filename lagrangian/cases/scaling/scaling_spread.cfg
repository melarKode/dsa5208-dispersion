# Strong/weak scaling, near-uniform load: a very wide cloud (sigma = 128 m) in
# a 128 x 128 x 32 m periodic box wraps to a nearly flat distribution, so every
# rank holds about the same number of particles and particles migrate steadily
# across rank faces. Only t = 0 and the end are written, so timings are dominated
# by stepping and migration. Scale particle_count with --set.
case_name=scaling_spread
nx=128
ny=128
nz=32
dx=1.0
dy=1.0
dz=1.0
u=2.0
v=1.0
w=0.0
diffusivity=1.0
source_x=64.0
source_y=64.0
source_z=16.0
source_sigma=128.0
particle_count=10000000
seed=301
dt=0.1
end_time=10.0
output_interval=10.0
write_concentration=false
